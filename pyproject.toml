[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-engine"
version = "2.0.0"
description = "AI Novel Writer & Engine: Autonomous literary craft architecture with 100-author knowledge graph, 5-stage Director-Actor-Stylist pipeline, zero filter verbs, and strict anti-slop gates."
readme = "README.md"
authors = [{ name = "Jaswanth Reddy", email = "jaswanthreddy1537@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["novel-writing", "creative-writing", "literary-craft", "narrative-generation", "fiction-engine", "anti-slop", "knowledge-graph", "storytelling", "ai-agents"]
dependencies = [
    "pyyaml>=6.0.1",
    "rich>=13.7.1"
]

[project.scripts]
novel-engine = "engine.cli:main"
novel-writer = "engine.cli:main"
ai-novel-writer = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/Jaswanth1902/AI_Novel_Engine"
Repository = "https://github.com/Jaswanth1902/AI_Novel_Engine"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

