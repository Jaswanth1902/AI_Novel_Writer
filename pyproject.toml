[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-engine"
version = "2.0.0"
description = "Autonomous high-craft AI Novel Engine enforcing 5-stage Director-Actor-Stylist architecture, zero filter verbs, and strict anti-slop gates."
readme = "README.md"
authors = [{ name = "Jaswanth Reddy", email = "jaswanthreddy1537@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "rich>=13.7.1"
]

[project.scripts]
novel-engine = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/Jaswanth1902/AI_Novel_Engine"
Repository = "https://github.com/Jaswanth1902/AI_Novel_Engine"
